name: Debug kconfig (store symbol)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: istoreos-25.12
          fetch-depth: 1

      - name: Sanitize U-Boot Makefile
        run: |
          f=package/boot/uboot-rockchip/Makefile
          n=$(grep -n 'BuildPackage/U-Boot' "$f" | head -1 | cut -d: -f1)
          head -n "$n" "$f" > "$f.tmp" && mv "$f.tmp" "$f"

      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y build-essential git python3 gawk libncurses-dev rsync unzip

      - name: Update and install feeds
        run: |
          echo "src-git qmodem https://github.com/FUjr/QModem.git;main" >> feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Config like production
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_rockchip=y
          CONFIG_TARGET_rockchip_armv8=y
          CONFIG_TARGET_rockchip_armv8_DEVICE_nlnet_xiguapi-v3=y
          CONFIG_DISPLAY_SUPPORT=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_xz-utils=y
          CONFIG_PACKAGE_luci-app-store=y
          EOF
          make defconfig 2>&1 | tee defconfig.log || true
          grep -n 'recursive\|MISSING' defconfig.log || true
          echo '--- .config state ---'
          grep -E 'PACKAGE_luci-app-store|PACKAGE_taskd|PACKAGE_luci-lib-taskd|PACKAGE_luci-lib-xterm|PACKAGE_xz-utils|PACKAGE_tar=' .config || echo 'none present'

      - name: Dump ground truth
        run: |
          echo '=== lines before store block (enclosing menu) ==='
          sed -n '66770,66810p' tmp/.config-package.in
          echo '=== .config around luci-app-* neighbors ==='
          grep -n 'luci-app-strongswan-swanctl\|luci-app-store\|luci-app-statistics\|luci-app-sqm' .config | head
          echo '=== force via scripts/config ==='
          scripts/config --enable PACKAGE_luci-app-store 2>&1 | head -3 || true
          grep -n 'PACKAGE_luci-app-store' .config || echo 'still absent after scripts/config'
          echo '=== make oldconfig ==='
          yes '' | make oldconfig >/dev/null 2>&1 || true
          grep -n 'PACKAGE_luci-app-store' .config || echo 'still absent after oldconfig'
          echo '=== target check: is symbol visible? ==='
          make -s -f - printstore <<'MKF' 2>&1 | head -20 || true
          include .config
          printstore: ; @echo "STORE=$(CONFIG_PACKAGE_luci-app-store)"
          MKF
