name: Build iStoreOS 24.10 for XGPV3

on:
  workflow_dispatch:
  push:
    branches:
      - istoreos-24.10
    paths:
      - '.github/workflows/build-xgpv3.yml'
  schedule:
    # 每周六 20:00 Asia/Shanghai (= 12:00 UTC)
    - cron: '0 12 * * 6'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: istoreos-24.10
          fetch-depth: 1

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            /usr/lib/jvm /usr/local/lib/node_modules
          sudo apt-get clean
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools python3-yaml python3-pyelftools python3-dev \
            rsync swig unzip zlib1g-dev file wget bc cpio libelf-dev \
            texinfo time xsltproc subversion openssl
          python3 -c 'import elftools; print("pyelftools", elftools.__version__)' \
            || sudo pip3 install --break-system-packages pyelftools
          python3 -c 'import elftools; print("pyelftools OK", elftools.__version__)'

      - name: Add Mali GPU (panfrost) kernel packages
        run: |
          # 24.10 的 video.mk 既没有 drm-panfrost 也没有 drm-sched，两个都要注入
          # 6.6 的调度器模块与 6.12 同名：drivers/gpu/drm/scheduler/gpu-sched.ko
          f=package/kernel/linux/modules/video.mk
          if grep -q 'KernelPackage/drm-panfrost' "$f"; then
            echo 'panfrost already present'
          else
            cat >> "$f" <<'VEOF'

          define KernelPackage/drm-sched
            SUBMENU:=$(VIDEO_MENU)
            HIDDEN:=1
            TITLE:=DRM scheduler
            DEPENDS:=+kmod-drm
            KCONFIG:=CONFIG_DRM_SCHED
            FILES:=$(LINUX_DIR)/drivers/gpu/drm/scheduler/gpu-sched.ko
            AUTOLOAD:=$(call AutoProbe,gpu-sched)
          endef

          define KernelPackage/drm-panfrost
            SUBMENU:=$(VIDEO_MENU)
            TITLE:=DRM support for ARM Mali Midgard/Bifrost GPUs
            DEPENDS:=@(TARGET_rockchip||TARGET_sunxi) +kmod-drm +kmod-drm-sched +kmod-drm-shmem-helper
            KCONFIG:=CONFIG_DRM_PANFROST
            FILES:=$(LINUX_DIR)/drivers/gpu/drm/panfrost/panfrost.ko
            AUTOLOAD:=$(call AutoProbe,panfrost)
          endef

          define KernelPackage/drm-panfrost/description
            DRM driver for ARM Mali Midgard (T6xx/T7xx/T8xx) and
            Bifrost (G3x/G5x/G7x) GPUs. Used by RK3568 Mali-G52.
          endef

          $(eval $(call KernelPackage,drm-sched))
          $(eval $(call KernelPackage,drm-panfrost))
          VEOF
            echo 'panfrost + drm-sched appended'
          fi
          tail -40 "$f"

      - name: Set LAN IP, hostname, root password and WiFi defaults
        run: |
          d=target/linux/rockchip/armv8/base-files/etc/uci-defaults
          mkdir -p "$d"
          HASH=$(openssl passwd -6 -salt xgpv3 'qweasd')
          echo "shadow hash: ${HASH}"
          cat > "$d/99-xgpv3-defaults" <<'UEOF'
          #!/bin/sh
          # XGPV3 defaults: LAN 10.10.10.1 / hostname zzXGP / root qweasd / WiFi zzXGP(qweasdzxc)
          uci -q batch <<'UCI'
          set network.lan.proto='static'
          set network.lan.ipaddr='10.10.10.1'
          set network.lan.netmask='255.255.255.0'
          set network.lan.ip6assign='60'
          commit network
          set dhcp.lan.ignore='0'
          commit dhcp
          set system.@system[0].hostname='zzXGP'
          set system.@system[0].timezone='CST-8'
          set system.@system[0].zonename='Asia/Shanghai'
          commit system
          UCI
          # WiFi 自动开启：OpenWrt 默认 radio disabled=1；配置缺失时先生成默认配置
          [ -f /etc/config/wireless ] || /sbin/wifi config
          wi=0
          while uci -q get "wireless.@wifi-device[$wi]" >/dev/null 2>&1; do
            uci set "wireless.@wifi-device[$wi].disabled='0'"
            uci set "wireless.@wifi-device[$wi].country='CN'"
            wi=$((wi+1))
          done
          wi=0
          while uci -q get "wireless.@wifi-iface[$wi]" >/dev/null 2>&1; do
            uci set "wireless.@wifi-iface[$wi].ssid='zzXGP'"
            uci set "wireless.@wifi-iface[$wi].encryption='psk2'"
            uci set "wireless.@wifi-iface[$wi].key='qweasdzxc'"
            wi=$((wi+1))
          done
          uci commit wireless
          # Docker：rootfs 为 f2fs，overlay2 与其不兼容，改用 vfs 存储驱动
          if [ -f /etc/config/dockerd ]; then
            uci set dockerd.globals.storage_driver='vfs'
            uci commit dockerd
          fi
          sed -i 's#^root:[^:]*:#root:__SHADOW_HASH__:#' /etc/shadow
          [ -x /etc/init.d/dropbear ] && /etc/init.d/dropbear enable
          [ -x /etc/init.d/uhttpd ] && /etc/init.d/uhttpd enable
          exit 0
          UEOF
          sed -i "s#__SHADOW_HASH__#${HASH}#" "$d/99-xgpv3-defaults"
          chmod +x "$d/99-xgpv3-defaults"
          echo '--- generated file ---'
          cat "$d/99-xgpv3-defaults"

      - name: Update and install feeds
        run: |
          cat >> feeds.conf.default <<'FEOF'
          src-git qmodem https://github.com/FUjr/QModem.git;main
          # passwall2 官方要求两个 feed：核心组件包 + LuCI 应用
          src-git passwall_packages https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git;main
          src-git passwall2 https://github.com/Openwrt-Passwall/openwrt-passwall2.git;main
          # lucky 官方 OpenWrt 打包（含 lucky 二进制包 + LuCI 应用）
          src-git lucky https://github.com/gdy666/luci-app-lucky.git;main
          # quickfile 文件管理（含 rust 后端 quickfile + LuCI 应用）
          src-git quickfile https://github.com/sbwml/luci-app-quickfile.git;main
          # iStoreOS 首页/网络向导（linkease 官方：LuCI 前端 + quickstart 后端）
          src-git nas_luci https://github.com/linkease/nas-packages-luci.git;master
          src-git nas_packages https://github.com/linkease/nas-packages.git;master
          FEOF
          cat feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          echo '--- extra feed contents ---'
          for f in qmodem passwall_packages passwall2 lucky quickfile nas_luci nas_packages; do
            echo "== $f =="; ls -1 package/feeds/$f 2>/dev/null | head -30
          done

      - name: Add XGPV3 screen packages
        run: |
          git clone --depth 1 https://github.com/junhong-l/xgp-v3-screen.git zz-packages
          ln -sfn ../zz-packages package/zz-packages
          ls -la package/zz-packages
          grep -n 'PKG_NAME\|KernelPackage\|BuildPackage' package/zz-packages/Makefile | head

      - name: Add turboacc (SFE 内核补丁) and kucat theme
        run: |
          # turboacc 官方集成脚本：打 shortcut-fe/fullcone 内核补丁(支持6.6)、
          # 替换 firewall4/nftables/libnftnl 为打过补丁的版本、装入 luci-app-turboacc
          curl -sSL https://raw.githubusercontent.com/chenmozhijin/turboacc/luci/add_turboacc.sh -o /tmp/add_turboacc.sh
          bash /tmp/add_turboacc.sh
          ls -1 package/turboacc
          # kucat 主题（JS 版，单包仓库）
          git clone --depth 1 https://github.com/sirpdboy/luci-theme-kucat.git package/luci-theme-kucat
          rm -rf package/luci-theme-kucat/.git
          grep -m2 'PKG_NAME\|LUCI_TITLE' package/luci-theme-kucat/Makefile

      - name: Generate build config
        run: |
          cat > .config <<'CEOF'
          CONFIG_TARGET_rockchip=y
          CONFIG_TARGET_rockchip_armv8=y
          CONFIG_TARGET_rockchip_armv8_DEVICE_nlnet_xiguapi-v3=y
          CONFIG_TARGET_ROOTFS_SQUASHFS=y
          CONFIG_TARGET_ROOTFS_EXT4FS=y
          CONFIG_TARGET_KERNEL_PARTSIZE=64
          CONFIG_TARGET_ROOTFS_PARTSIZE=1024
          CONFIG_FEED_qmodem=y
          CONFIG_PACKAGE_luci=y
          # xz-utils 必须显式选中：tar 的 PACKAGE_TAR_XZ 默认 y，
          # 否则 luci-app-store 的守卫 depends on !(PACKAGE_TAR_XZ)||PACKAGE_xz-utils 为假，
          # 整个 store 符号不可见、被 kconfig 静默丢弃（含 taskd/luci-lib-taskd 链）
          CONFIG_PACKAGE_xz-utils=y
          CONFIG_PACKAGE_luci-app-store=y
          # AP 守护进程：不带 wpad 无线无法起 AP
          CONFIG_PACKAGE_wpad-basic-mbedtls=y
          CONFIG_PACKAGE_kmod-mt7915e=y
          CONFIG_PACKAGE_kmod-mt7915-firmware=y
          CONFIG_PACKAGE_kmod-mt7916-firmware=y
          CONFIG_PACKAGE_kmod-drm-panfrost=y
          CONFIG_PACKAGE_kmod-fb-tft=y
          CONFIG_PACKAGE_kmod-fb-tft-gc9307=y
          CONFIG_PACKAGE_xgp-v3-screen=y
          CONFIG_PACKAGE_qmodem=y
          CONFIG_PACKAGE_luci-app-qmodem-next=y
          CONFIG_PACKAGE_kmod-pcie_mhi=y
          # Docker：dockerman 自动拉起 docker/dockerd/docker-compose/ttyd/luci-lib-docker
          CONFIG_PACKAGE_dockerd=y
          CONFIG_PACKAGE_docker=y
          CONFIG_PACKAGE_docker-compose=y
          CONFIG_PACKAGE_luci-app-dockerman=y
          CONFIG_PACKAGE_ttyd=y
          # 内核容器支持：rockchip 非 small-flash 默认已开，显式写出保险
          CONFIG_KERNEL_CGROUPS=y
          CONFIG_KERNEL_NAMESPACES=y
          CONFIG_PACKAGE_kmod-veth=y
          # turboacc 网络加速（BBR/流量分载/Shortcut-FE/FullCone NAT）
          CONFIG_PACKAGE_luci-app-turboacc=y
          CONFIG_PACKAGE_luci-app-turboacc_INCLUDE_BBR_CCA=y
          CONFIG_PACKAGE_luci-app-turboacc_INCLUDE_OFFLOADING=y
          CONFIG_PACKAGE_luci-app-turboacc_INCLUDE_SHORTCUT_FE_CM=y
          CONFIG_PACKAGE_luci-app-turboacc_INCLUDE_NFT_FULLCONE=y
          # kucat 主题
          CONFIG_PACKAGE_luci-theme-kucat=y
          # passwall2（核心组件由 passwall_packages feed 提供，默认 Xray+SingBox 全选）
          CONFIG_PACKAGE_luci-app-passwall2=y
          # lucky（DDNS/反代/AList 等全家桶）
          CONFIG_PACKAGE_lucky=y
          CONFIG_PACKAGE_luci-app-lucky=y
          # UPnP
          CONFIG_PACKAGE_luci-app-upnp=y
          # ttyd 网页终端（dockerd 已带 ttyd，这里补 LuCI 页面）
          CONFIG_PACKAGE_luci-app-ttyd=y
          # quickfile 文件管理
          CONFIG_PACKAGE_quickfile=y
          CONFIG_PACKAGE_luci-app-quickfile=y
          # smartdns（DNS 加速/分流）
          CONFIG_PACKAGE_luci-app-smartdns=y
          # nlbwmon 流量统计
          CONFIG_PACKAGE_luci-app-nlbwmon=y
          # openlist 网盘聚合
          CONFIG_PACKAGE_luci-app-openlist=y
          # iStoreOS 首页/网络向导（自动拉起 quickstart 后端）
          CONFIG_PACKAGE_luci-app-quickstart=y
          CEOF
          make defconfig
          echo '--- device / feed check ---'
          grep -E 'DEVICE_nlnet_xiguapi-v3|FEED_qmodem' .config || true
          echo '--- package check ---'
          for s in kmod-fb-tft kmod-fb-tft-gc9307 xgp-v3-screen kmod-mt7915e \
                   kmod-mt7915-firmware kmod-mt7916-firmware kmod-drm-panfrost kmod-drm-sched \
                   qmodem luci-app-qmodem-next kmod-pcie_mhi luci-app-store \
                   xz-utils tar taskd luci-lib-taskd luci-lib-xterm wpad-basic-mbedtls \
                   dockerd docker docker-compose luci-app-dockerman ttyd kmod-veth \
                   luci-app-turboacc luci-theme-kucat luci-app-passwall2 \
                   lucky luci-app-lucky luci-app-upnp luci-app-ttyd \
                   quickfile luci-app-quickfile \
                   luci-app-smartdns luci-app-nlbwmon luci-app-openlist \
                   luci-app-quickstart quickstart; do
            grep -E "^(CONFIG_PACKAGE_${s}=y|# CONFIG_PACKAGE_${s} is not set)" .config || echo "MISSING SYMBOL: ${s}"
          done
          grep -q 'CONFIG_TARGET_rockchip_armv8_DEVICE_nlnet_xiguapi-v3=y' .config || { echo 'ERROR: device symbol missing'; exit 1; }
          for s in xgp-v3-screen kmod-fb-tft-gc9307 kmod-drm-panfrost qmodem luci-app-qmodem-next luci-app-store wpad-basic-mbedtls dockerd luci-app-dockerman luci-app-turboacc luci-theme-kucat luci-app-passwall2 luci-app-lucky lucky luci-app-upnp luci-app-ttyd luci-app-quickfile quickfile luci-app-smartdns luci-app-nlbwmon luci-app-openlist luci-app-quickstart quickstart; do
            grep -q "CONFIG_PACKAGE_${s}=y" .config || { echo "ERROR: required package dropped: ${s}"; exit 1; }
          done

      - name: Prerequisite check
        run: |
          make prereq 2>&1 | tee prereq.log || (tail -60 prereq.log | sed 's/%/%25/g' | tr -d '\r' | sed 's/^/::error::/'; exit 1)

      - name: Download package sources
        run: |
          make -j$(nproc) download V=s 2>&1 | tee download.log || make -j1 download V=s 2>&1 | tee -a download.log || echo 'WARN: download had failures, build will retry'

      - name: Build firmware
        run: |
          make -j$(nproc) 2>&1 | tee build.log || make -j1 V=s 2>&1 | tee -a build.log || (tail -80 build.log | sed 's/%/%25/g' | tr -d '\r' | sed 's/^/::error::/'; exit 1)

      - name: Write build summary
        if: always()
        run: |
          {
            echo '## iStoreOS 24.10 / XGPV3 build'
            echo ''
            echo '| item | value |'
            echo '|---|---|'
            echo "| commit | ${GITHUB_SHA:0:8} |"
            echo "| trigger | ${GITHUB_EVENT_NAME} |"
            echo "| profile | nlnet_xiguapi-v3 |"
            echo ''
            echo '### key packages'
            echo '```'
            if [ -f bin/targets/rockchip/armv8/*.manifest ]; then
              grep -iE 'xgp|gc9307|fb-tft|qmodem|pcie_mhi|mt7915|mt7916|panfrost|drm-sched|drm-shmem|luci-app-store|taskd|xz-utils|wpad|docker|ttyd|turboacc|kucat|passwall|lucky|quickfile|upnp|smartdns|nlbwmon|openlist|quickstart|shortcut-fe|fullcone|^tar ' bin/targets/rockchip/armv8/*.manifest || true
              echo '--- total packages ---'
              wc -l < bin/targets/rockchip/armv8/*.manifest
            else
              echo 'manifest not produced'
            fi
            echo '```'
            echo '### images'
            echo '```'
            ls -lh bin/targets/rockchip/armv8/*sysupgrade* 2>/dev/null || echo 'no image'
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Collect artifacts
        if: always()
        run: |
          mkdir -p artifacts
          cp -v bin/targets/rockchip/armv8/*sysupgrade* artifacts/ 2>/dev/null || true
          cp -v bin/targets/rockchip/armv8/*.manifest artifacts/ 2>/dev/null || true
          cp -v bin/targets/rockchip/armv8/config.buildinfo artifacts/ 2>/dev/null || true
          cp -v bin/targets/rockchip/armv8/sha256sums artifacts/ 2>/dev/null || true
          cp -v build.log prereq.log download.log artifacts/ 2>/dev/null || true
          ls -la artifacts

      - name: Upload firmware
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: istoreos-24.10-xgpv3
          path: artifacts/*
          if-no-files-found: warn

      - name: Prepare release files
        if: success()
        run: |
          mkdir -p release
          cp -v bin/targets/rockchip/armv8/*sysupgrade* release/
          cp -v bin/targets/rockchip/armv8/*.manifest release/ 2>/dev/null || true
          cp -v bin/targets/rockchip/armv8/config.buildinfo release/ 2>/dev/null || true
          cp -v bin/targets/rockchip/armv8/sha256sums release/ 2>/dev/null || true
          ls -lh release

      - name: Publish to Releases
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: xgpv3-2410-r${{ github.run_number }}
          name: XGPV3 iStoreOS 24.10 build ${{ github.run_number }}
          body: |
            iStoreOS 24.10 / NLnet XiGuaPi V3 (RK3568) 自动构建固件（内核 6.6，ipk/opkg 包体系）

            - commit: `${{ github.sha }}`
            - trigger: `${{ github.event_name }}`
            - 后台: 10.10.10.1 / root / qweasd（hostname zzXGP）
            - WiFi: 默认开启，SSID `zzXGP`，密码 `qweasdzxc`（WPA2，国家码 CN）
            - 组件: QModem(FUjr) + luci-app-qmodem-next + kmod-pcie_mhi、GC9307 屏幕三件套、MT7915/MT7916 固件、kmod-drm-panfrost、iStore 商店、wpad-basic-mbedtls
            - squashfs 用于刷机/升级；ext4 用于 TF 卡/扩容场景
          files: release/*
          fail_on_unmatched_files: true
