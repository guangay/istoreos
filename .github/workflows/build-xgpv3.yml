name: Build iStoreOS 25.12 for XGPV3

on:
  workflow_dispatch:
  push:
    branches:
      - istoreos-25.12
    paths:
      - '.github/workflows/build-xgpv3.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 420

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: istoreos-25.12
          fetch-depth: 1

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            /usr/lib/jvm /usr/local/lib/node_modules
          sudo apt-get clean
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools python3-yaml rsync swig unzip zlib1g-dev file \
            wget bc cpio libelf-dev texinfo time xsltproc subversion

      - name: Update and install feeds
        run: |
          echo "src-git qmodem https://github.com/zzzz0317/QModem.git;v3.0.1" >> feeds.conf.default
          cat feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Add XGPV3 screen packages
        run: |
          git clone --depth 1 https://github.com/junhong-l/xgp-v3-screen.git zz-packages
          ln -sfn ../zz-packages package/zz-packages
          ls -la package/zz-packages

      - name: Generate build config
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_rockchip=y
          CONFIG_TARGET_rockchip_armv8=y
          CONFIG_TARGET_rockchip_armv8_DEVICE_nlnet_xiguapi-v3=y
          CONFIG_TARGET_ROOTFS_SQUASHFS=y
          CONFIG_TARGET_ROOTFS_EXT4FS=y
          CONFIG_TARGET_KERNEL_PARTSIZE=64
          CONFIG_TARGET_ROOTFS_PARTSIZE=1024
          CONFIG_FEED_qmodem=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-app-store=y
          CONFIG_PACKAGE_kmod-mt7915e=y
          CONFIG_PACKAGE_kmod-drm-panfrost=y
          CONFIG_DRM_SHMEM_HELPER=m
          CONFIG_PACKAGE_kmod-fb-tft=y
          CONFIG_PACKAGE_kmod-fb-tft-gc9307=y
          CONFIG_PACKAGE_xgp-v3-screen=y
          CONFIG_PACKAGE_luci-app-xgp-v3-screen-brightness=y
          CONFIG_PACKAGE_qmodem=y
          CONFIG_PACKAGE_luci-app-qmodem=y
          CONFIG_PACKAGE_luci-app-qmodem-sms=y
          CONFIG_PACKAGE_luci-app-qmodem-mwan=y
          CONFIG_PACKAGE_luci-i18n-qmodem-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-qmodem-sms-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-qmodem-mwan-zh-cn=y
          EOF
          make defconfig
          echo '--- device check ---'
          grep -E 'DEVICE_nlnet_xiguapi-v3|FEED_qmodem|luci-app-qmodem=|xgp-v3-screen=|kmod-fb-tft' .config || true
          grep -q 'CONFIG_TARGET_rockchip_armv8_DEVICE_nlnet_xiguapi-v3=y' .config || { echo 'ERROR: device symbol missing'; exit 1; }

      - name: Download package sources
        run: |
          make -j$(nproc) download V=s || make -j1 download V=s

      - name: Build firmware
        run: |
          make -j$(nproc) || make -j1 V=s

      - name: Collect artifacts
        if: always()
        run: |
          mkdir -p artifacts
          cp -v bin/targets/rockchip/armv8/*sysupgrade* artifacts/ 2>/dev/null || true
          cp -v bin/targets/rockchip/armv8/*.manifest artifacts/ 2>/dev/null || true
          cp -v bin/targets/rockchip/armv8/config.buildinfo artifacts/ 2>/dev/null || true
          cp -v bin/targets/rockchip/armv8/sha256sums artifacts/ 2>/dev/null || true
          ls -la artifacts

      - name: Upload firmware
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: istoreos-25.12-xgpv3
          path: artifacts/*
          if-no-files-found: warn
